services:
  channel-management-api:
    build:
      context: ./Application/ChannelManagementService
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "127.0.0.1:${BIZCORD_API_PORT:-18080}:8080"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${BIZCORD_PROMETHEUS_PORT:-19090}:9090"
    depends_on:
      - channel-management-api

    sqlserver:
     image: mcr.microsoft.com/mssql/server:2025-latest
     environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
     ports:
      - "127.0.0.1:1433:1433"
     volumes:
      - sqlserver-data:/var/opt/mssql

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${BIZCORD_JAEGER_PORT:-16687}:16686"

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"