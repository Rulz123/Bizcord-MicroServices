services:
  channel-management-api:
    build:
      context: ./Application/ChannelManagementService
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "127.0.0.1:${BIZCORD_API_PORT:-18080}:8080"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${BIZCORD_JAEGER_PORT:-16687}:16686"